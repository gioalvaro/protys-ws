name: Verify prototype and research package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare isolated OWL and SWRL runtimes
        run: ./research/reproduce.sh --prepare-only
      - name: Verify backend, including real reasoning engines
        run: ./backend/mvnw -B -f backend/pom.xml verify
      - name: Verify output preservation
        run: python3 -m unittest discover -s research/evaluation/tests -v
      - name: Verify ownership checks and interrupted rule restoration
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify functional scenarios and complete query outputs
        run: ./research/reproduce.sh --functional
      # The 120 benchmark replicas are a separate controlled experiment.
      - name: Preserve verification outputs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-and-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports/
            research/evaluation/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use declared npm version
        run: npm install --global npm@11.16.0
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'

  docker-demonstration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start fresh Docker services and verify API through Nginx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          try:
              subprocess.run([sys.executable, 'scripts/demo.py', 'up'], check=True)
              states = list(Path('.local-demo').glob('*/state.json'))
              if len(states) != 1:
                  raise RuntimeError('Expected one fresh, owned demonstration')
              subprocess.run([sys.executable, 'scripts/demo.py', 'smoke', '--state', str(states[0])], check=True)
          finally:
              for state in Path('.local-demo').glob('*/state.json'):
                  subprocess.run([sys.executable, 'scripts/demo.py', 'down', '--state', str(state), '--remove-data'], check=True)
          PY
      - name: Preserve startup and HTTP verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-demonstration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-demo/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
