services:
  # Uses pinned Jena4.10 dependencies and a project-owned persistent dataset.
  protys-fuseki:
    image: ${COMPOSE_PROJECT_NAME:-protys}-backend:maintenance
    build:
      context: ..
      dockerfile: backend/Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec java -Xmx2g -Djava.awt.headless=true
        -cp "/opt/protys/research/runtime/validator/target/classes:$$(cat /opt/protys/research/runtime/validator/target/fuseki-classpath.txt)"
        org.apache.jena.fuseki.main.cmds.FusekiMainCmd
        --port=3030 --config=/opt/protys/docker/fuseki-config.ttl
    ports:
      - "127.0.0.1:${PROTYS_FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki-data:/fuseki
    networks: [protys-network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/protys_canonical/query?query=ASK%7B%7D"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  protys-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protys_db}
      POSTGRES_USER: ${POSTGRES_USER:-protys_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protys_password}
    ports:
      - "127.0.0.1:${PROTYS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [protys-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  protys-backend:
    image: ${COMPOSE_PROJECT_NAME:-protys}-backend:maintenance
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${PROTYS_BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://protys-postgres:5432/${POSTGRES_DB:-protys_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-protys_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-protys_password}
      PROTYS_RESEARCH_ROOT: /opt/protys
      FUSEKI_ENDPOINT: http://protys-fuseki:3030/protys_canonical
      FUSEKI_QUERY_ENDPOINT: http://protys-fuseki:3030/protys_canonical/query
      FUSEKI_UPDATE_ENDPOINT: http://protys-fuseki:3030/protys_canonical/update
      FUSEKI_GSP_ENDPOINT: http://protys-fuseki:3030/protys_canonical/data
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_PROTYS_WS: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
    depends_on:
      protys-postgres:
        condition: service_healthy
      protys-fuseki:
        condition: service_healthy
    networks: [protys-network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Asserted sources go through API so modules and rules have SQL metadata too.
  protys-init:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir rdflib==7.1.4
        WORKDIR /opt/protys
        COPY ontologies/ ontologies/
        COPY research/catalog.json research/catalog.json
        COPY research/model/ research/model/
        COPY research/data/ research/data/
        COPY docker/load_canonical.py docker/init-fuseki.sh docker/
        ENV PROTYS_REPOSITORY=/opt/protys
        ENTRYPOINT ["/bin/sh", "/opt/protys/docker/init-fuseki.sh"]
    environment:
      FUSEKI_URL: http://protys-fuseki:3030
      FUSEKI_DATASET: protys_canonical
      PROTYS_BACKEND_URL: http://protys-backend:8080
    depends_on:
      protys-fuseki:
        condition: service_healthy
      protys-backend:
        condition: service_healthy
    networks: [protys-network]
    restart: "no"

  protys-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PROTYS_FRONTEND_PORT:-8081}:80"
    depends_on:
      protys-init:
        condition: service_completed_successfully
    networks: [protys-network]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  protys-network:
    driver: bridge

volumes:
  fuseki-data:
  postgres-data:
