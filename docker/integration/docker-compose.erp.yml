# Fuentes ERP para la prueba de integración de la Fase 1 (trabajo técnico 2026-11).
# Se usa SIEMPRE junto con la composición de la plataforma, para compartir la red:
#   docker compose -f docker/docker-compose.yml -f docker/integration/docker-compose.erp.yml up -d
# Con varios archivos, Compose resuelve las rutas relativas desde la carpeta del
# primero (docker/), por eso las rutas de abajo empiezan con ./integration/.
# Credenciales de demostración: ver docker/integration/.env.example.

services:
  # --- ADempiere: sólo la base, con la semilla oficial 3.9.4 (GardenWorld). ---
  adempiere-db:
    image: protys-erp-adempiere-db:3.9.4
    build:
      context: ./integration/adempiere-db
    environment:
      POSTGRES_DB: adempiere
      POSTGRES_USER: ${ERP_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${ERP_ADMIN_PASSWORD:-demo_admin}
      ADEMPIERE_DB_PASSWORD: ${ADEMPIERE_DB_PASSWORD:-adempiere_demo}
      PROTYS_RO_USER: ${PROTYS_RO_USER:-protys_ro}
      PROTYS_RO_PASSWORD: ${PROTYS_RO_PASSWORD:-protys_ro_demo}
    ports:
      - "127.0.0.1:${ERP_ADEMPIERE_DB_PORT:-55433}:5432"
    volumes:
      - adempiere-db-data:/var/lib/postgresql/data
    networks: [protys-network]
    healthcheck:
      # Listo recién cuando existe el rol de sólo lectura (último paso de la restauración).
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d adempiere -tAc \"SELECT 1 FROM pg_roles WHERE rolname='$${PROTYS_RO_USER}'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # --- Odoo: imagen oficial + su PostgreSQL, con mrp y datos de demostración. ---
  odoo-db:
    image: postgres:15.10@sha256:d609c3005478af92bddad773423df829b7402ea0b356d5b72edd2fd54d1ad3ea
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo_demo}
    ports:
      - "127.0.0.1:${ERP_ODOO_DB_PORT:-55432}:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks: [protys-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Una sola vez: instala mrp con demo y crea el rol de sólo lectura.
  odoo-init:
    image: odoo:17.0@sha256:8779f8157ddcc37b84014c94646073f46fd4ad776b7a5d95fc3b0dc73a24a8fa
    entrypoint: ["/bin/sh", "/opt/protys-erp/inicializar.sh"]
    environment:
      ODOO_DB_HOST: odoo-db
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo_demo}
      ODOO_DB_NAME: odoo
      PROTYS_RO_USER: ${PROTYS_RO_USER:-protys_ro}
      PROTYS_RO_PASSWORD: ${PROTYS_RO_PASSWORD:-protys_ro_demo}
    volumes:
      - ./integration/odoo/inicializar.sh:/opt/protys-erp/inicializar.sh:ro
      - odoo-filestore:/var/lib/odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    networks: [protys-network]
    restart: "no"

  # Servidor web de Odoo, opcional, sólo para mirar los datos a mano:
  #   ... --profile ui up -d odoo   →  http://127.0.0.1:8069 (admin/admin de la demo)
  # No forma parte de la prueba: run.sh no lo levanta.
  odoo:
    image: odoo:17.0@sha256:8779f8157ddcc37b84014c94646073f46fd4ad776b7a5d95fc3b0dc73a24a8fa
    profiles: ["ui"]
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo_demo}
    command: ["--", "-d", "odoo", "--db-filter=^odoo$$"]
    ports:
      - "127.0.0.1:${ERP_ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - odoo-filestore:/var/lib/odoo
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    networks: [protys-network]

  # Agrega al backend de la plataforma los mapeos R2RML de los dos ERP (sólo lectura).
  protys-backend:
    volumes:
      - ./integration/mappings:/opt/protys/integration/mappings:ro

volumes:
  adempiere-db-data:
  odoo-db-data:
  odoo-filestore:
